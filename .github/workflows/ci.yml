name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/workspace.js
          node --check src/renderer.js

      - name: Validate package metadata
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='ordax-agent-hub'||!/^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$/.test(p.version)||p.main!=='src/main.js') process.exit(1)"
