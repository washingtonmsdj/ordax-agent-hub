name: Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/workspace.js
          node --check src/renderer.js

      - name: Build Windows installer and portable app
        run: npm run dist:win

      - name: Verify Windows artifacts and write checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $setup = "dist/OrdaX-Agent-Hub-Setup-$version-x64.exe"
          $portable = "dist/OrdaX-Agent-Hub-Portable-$version-x64.exe"
          foreach ($file in @($setup, $portable)) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing expected artifact: $file"
              exit 1
            }
          }
          Get-FileHash $setup, $portable -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ordax-agent-hub-windows-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
