name: OrdaX exact CLI physical proof

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ordax-exact-cli-proof.yml

permissions:
  contents: write

concurrency:
  group: ordax-exact-cli-physical-proof
  cancel-in-progress: false

jobs:
  exact-cli-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_COMMIT: ad813ae13d544d420003e6e5dda7b51e63217dea
      BASE_COMMIT: 9aebbe36704ebc0b663413df3ca7161b7641bc92
      UPDATE_HEAD: ca64c21476c4e30f85c2eeff1f9c0d9d44a23d5d
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout UPDATE-116 source
        uses: actions/checkout@v4
        with:
          repository: washingtonmsdj/novo-ordax-os
          ref: work/update/116-modular-updater-v1
          fetch-depth: 0
          path: novo
          persist-credentials: false

      - name: Verify source and configure trusted Git identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C novo rev-parse HEAD)" = "$UPDATE_HEAD"
          git -C novo cat-file -e "$TARGET_COMMIT^{commit}"
          git -C novo cat-file -e "$BASE_COMMIT^{commit}"
          test "$(git -C novo merge-base "$BASE_COMMIT" "$TARGET_COMMIT")" = "$BASE_COMMIT"
          git config --global user.name washingtonmsdj
          git config --global user.email washingtonmsdj@gmail.com
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Execute exact ordax-dev apply command
        shell: bash
        run: |
          set -euo pipefail
          cd novo
          ./scripts/ordax-dev apply "$TARGET_COMMIT" --base "$BASE_COMMIT" --timeout 1200 | tee /tmp/ordax-exact-cli-result.json

      - name: Assert one-shot result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/ordax-exact-cli-result.json').read_text())
          result = data['result']
          request = data['request']
          assert result['state'] == 'PASS', result
          assert result['final_receipt'] == 'PASS', result
          assert result['runtime_mutation_performed'] is True, result
          assert result['affected_modules'] == ['ordax.time'], result
          assert request['request']['single_shot'] is True, request
          assert request['execution']['runtime_executor'] == 'ordax.control-plane.development-agent', request
          assert request['execution']['activation_adapter'] == 'ordax-module-sync', request
          assert request['execution']['second_executor'] is False, request
          assert request['execution']['second_update_authority'] is False, request
          print('ORDAX_EXACT_CLI_PHYSICAL_PROOF=PASS')
          print('source_commit=' + result['source_commit'])
          print('active_release_digest=' + result['active_release_digest'])
          print('mailbox_request_id=' + result['mailbox_request_id'])
          print('control_plane_job_id=' + result['control_plane_job_id'])
          print('checkpoint_ref=' + str(result['checkpoint_ref']))
          print('mailbox_cleanup=' + result['mailbox_cleanup'])
          PY
